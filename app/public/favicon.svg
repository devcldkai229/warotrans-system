<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="waro-blue" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Industrial Rounded Brandmark -->
  <rect width="64" height="64" rx="14" fill="url(#waro-blue)"/>
  
  <!-- WaroTrans Route & Waypoint Icon -->

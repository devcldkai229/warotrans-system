    <!-- Autonomous Nav2 Route Path -->
    <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" stroke="#FFFFFF" stroke-width="2.6"/>

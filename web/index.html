<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_wrt.png" />
    <link rel="apple-touch-icon" href="/logo_wrt.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#242526" />
    <script>
      // Pick the saved theme before the first paint (dark is the default), so the page never flashes the other one.
      try {
        var saved = window.localStorage.getItem('warotrans.theme')
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
        if (saved === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>WaroTrans</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

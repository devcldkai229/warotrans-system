# Manual: build the web app (same origin as the API, VITE_API_URL empty) and publish it behind the demo's CloudFront
# (design §8 D). index.html is never cached; hashed assets for a year. Environment "demo" (required reviewers).
# Repository variables: AWS_ACCOUNT_ID, DEMO_WEB_BUCKET, DEMO_DISTRIBUTION_ID.

name: Web release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        required: true
        default: develop

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run build
        working-directory: web
        env:
          VITE_API_URL: ""
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/warotrans-demo-github-deploy
          aws-region: ap-southeast-1
      - name: Upload and invalidate
        run: |
          set -euo pipefail
          aws s3 sync --only-show-errors --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable" web/dist "s3://${{ vars.DEMO_WEB_BUCKET }}/"
          aws s3 cp --only-show-errors --cache-control no-cache web/dist/index.html "s3://${{ vars.DEMO_WEB_BUCKET }}/index.html"
          aws cloudfront create-invalidation --distribution-id "${{ vars.DEMO_DISTRIBUTION_ID }}" --paths /index.html / >/dev/null
          echo "web $(git rev-parse --short=12 HEAD) released" >> "$GITHUB_STEP_SUMMARY"

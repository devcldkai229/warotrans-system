# Manual: switch the AWS demo lab OFF (design §10 STOP). Same steps as infrastructure/terraform/scripts/lab.sh stop:
# services to 0, CloudFront to the placeholder, runtime stack DESTROYED (NAT, ALB, endpoints, ECS - billed per hour),
# MongoDB and RDS stopped. Persistent data is never touched. Environment "demo" (required reviewers).
# Never while a robot is moving or holding cargo. The weekly schedule only re-stops RDS, which AWS restarts by itself
# after 7 days stopped (it does nothing while the lab is on: the runtime stack is then present).
# Repository variable: AWS_ACCOUNT_ID.

name: Lab stop

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "stop" - no robot is moving, holding cargo or uploading a recording'
        required: true
  schedule:
    - cron: "0 20 * * 0" # Monday 03:00 Asia/Ho_Chi_Minh

permissions:
  id-token: write
  contents: read

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  stop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - run: '[ "${{ inputs.confirm }}" = stop ] || { echo "::error::type stop to confirm"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/warotrans-demo-github-lab
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
      - run: bash infrastructure/terraform/scripts/lab.sh stop --yes
        env:
          STATE_BUCKET: warotrans-tfstate-${{ vars.AWS_ACCOUNT_ID }}

  restop-rds:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/warotrans-demo-github-lab
          aws-region: ap-southeast-1
      - name: Stop RDS again when the lab is off
        run: |
          if aws ecs describe-clusters --clusters warotrans-demo --query 'clusters[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "lab is on: nothing to do"; exit 0
          fi
          s=$(aws rds describe-db-instances --db-instance-identifier warotrans-demo --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "RDS: $s"
          [ "$s" = available ] && aws rds stop-db-instance --db-instance-identifier warotrans-demo >/dev/null && echo "stopped" || true

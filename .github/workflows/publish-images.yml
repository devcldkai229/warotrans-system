# Manual: build linux/arm64 images of one commit, test, push to ECR with the immutable tag <12-char sha>.
# Never deploys (design §8 B). The digests are printed and kept as the "release-manifest" artifact for deploy-demo.yml.
# Repository variable: AWS_ACCOUNT_ID.

name: Publish images

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag or commit to build"
        required: true
        default: develop
      service:
        description: "Image(s)"
        type: choice
        options: [all, system, evidence-recorder, evidence-worker]
        default: all

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  test:
    name: Backend tests of the commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test backend/tests/WaroTrans.UnitTests -c Release
      - run: dotnet test backend/tests/WaroTrans.ArchitectureTests -c Release
      - run: dotnet test backend/tests/WaroTrans.Evidence.UnitTests -c Release

  publish:
    name: Build and push (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - { name: system, repository: warotrans-system, file: src/WaroTrans.Host/Dockerfile, target: "" }
          - { name: evidence-recorder, repository: warotrans-evidence-recorder, file: src/WaroTrans.Evidence/Recorder/Dockerfile, target: "" }
          - { name: evidence-worker, repository: warotrans-evidence-worker, file: src/WaroTrans.Evidence/Worker/Dockerfile, target: runtime }
    steps:
      - name: selected?
        id: sel
        run: echo "build=${{ inputs.service == 'all' || inputs.service == matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.sel.outputs.build == 'true'
        with:
          ref: ${{ inputs.git_ref }}
      - id: sha
        if: steps.sel.outputs.build == 'true'
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.sel.outputs.build == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/warotrans-demo-github-publish
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        if: steps.sel.outputs.build == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: tag already published?
        id: exists
        if: steps.sel.outputs.build == 'true'
        run: |
          if aws ecr describe-images --repository-name ${{ matrix.repository }} --image-ids imageTag=${{ steps.sha.outputs.tag }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.repository }}:${{ steps.sha.outputs.tag }} exists (immutable tags)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.sel.outputs.build == 'true' && steps.exists.outputs.skip == 'false'
      - uses: docker/build-push-action@v6
        if: steps.sel.outputs.build == 'true' && steps.exists.outputs.skip == 'false'
        with:
          context: backend
          file: backend/${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ steps.sha.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: digest
        if: steps.sel.outputs.build == 'true'
        run: |
          d=$(aws ecr describe-images --repository-name ${{ matrix.repository }} --image-ids imageTag=${{ steps.sha.outputs.tag }} --query 'imageDetails[0].imageDigest' --output text)
          echo "${{ matrix.name }}=${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}@$d" | tee "${{ matrix.name }}.image"
          echo "### ${{ matrix.name }}: \`${{ matrix.repository }}@$d\` (tag ${{ steps.sha.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.sel.outputs.build == 'true'
        with:
          name: release-manifest-${{ matrix.name }}
          path: ${{ matrix.name }}.image

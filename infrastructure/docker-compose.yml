services:
  postgres:
    image: postgres:17-alpine
    container_name: warotrans-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warotrans}
      POSTGRES_USER: ${POSTGRES_USER:-warotrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warotrans}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warotrans} -d ${POSTGRES_DB:-warotrans}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: warotrans-mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-warotrans}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-warotrans}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-warotrans_operations}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: warotrans-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Evidence Recorder + Worker (ADR 0012). Off by default: `docker compose --profile evidence up -d`.
  # Local providers (folder + Postgres queue + ffmpeg) unless the Evidence__* AWS settings are given in .env.
  evidence-recorder:
    profiles: ["evidence"]
    build:
      context: ../backend
      dockerfile: src/WaroTrans.Evidence/Recorder/Dockerfile
    container_name: warotrans-evidence-recorder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ConnectionStrings__Evidence: Host=postgres;Port=5432;Database=warotrans_evidence;Username=${POSTGRES_USER:-warotrans};Password=${POSTGRES_PASSWORD:-warotrans}
      Evidence__MigrateOnStartup: "true"
      Evidence__CoreBaseUrl: ${EVIDENCE_CORE_BASE_URL:-http://host.docker.internal:5090}
      Evidence__Storage__LocalPublicBaseUrl: ${EVIDENCE_PUBLIC_BASE_URL:-http://localhost:5095}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EVIDENCE_RECORDER_PORT:-5095}:5095"
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy

  evidence-worker:
    profiles: ["evidence"]
    build:
      context: ../backend
      dockerfile: src/WaroTrans.Evidence/Worker/Dockerfile
    container_name: warotrans-evidence-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ConnectionStrings__Evidence: Host=postgres;Port=5432;Database=warotrans_evidence;Username=${POSTGRES_USER:-warotrans};Password=${POSTGRES_PASSWORD:-warotrans}
      Evidence__Media__Provider: ${EVIDENCE_MEDIA_PROVIDER:-Local}
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      evidence-recorder:
        condition: service_started

volumes:
  postgres_data:
  mongodb_data:
  mosquitto_data:
  mosquitto_log:
  evidence_data:
